// API del agente de PLC-Monitor.
// La app de escritorio (y cualquier otro cliente) habla con el agente local o remoto solo por aquí.
syntax = "proto3";

package plcmonitor.agent.v1;

option csharp_namespace = "PlcMonitor.Agent.Contracts";

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AgentService {
  // Versión del agente, máquina, drivers disponibles y acceso de quien llama.
  // Seguridad: si el agente tiene token, todas las llamadas lo exigen (UNAUTHENTICATED si falta). Con el token de solo
  // lectura, SetDeviceEnabled, Write, PutDevice, DeleteDevice, PutTransforms, RenameHistory, DeleteHistory, PutOpcUa,
  // TrustOpcUaCertificate y DeleteOpcUaCertificate devuelven PERMISSION_DENIED.
  rpc GetInfo(google.protobuf.Empty) returns (AgentInfo);

  // Dispositivos configurados con su estado de conexión.
  rpc ListDevices(google.protobuf.Empty) returns (DeviceList);

  // Activa o desactiva un dispositivo en caliente. Con persist=true se guarda en la configuración.
  rpc SetDeviceEnabled(SetDeviceEnabledRequest) returns (Device);

  // Información que da el propio dispositivo (modelo, firmware...). Vacío si no está conectado.
  rpc GetDeviceInfo(DeviceRequest) returns (DeviceInfo);

  // Tags configurados con su último valor.
  rpc ListTags(ListTagsRequest) returns (TagList);

  // Lectura bajo demanda de direcciones cualesquiera (no tienen que estar configuradas).
  rpc Read(ReadRequest) returns (ReadReply);

  // Escritura en un tag configurado. Exige WritesEnabled en el dispositivo y Writable en el tag.
  rpc Write(WriteRequest) returns (WriteReply);

  // Primero una foto completa (snapshot) y después los cambios de valores y de estado, sin huecos.
  // Si el cliente no consume a tiempo, el agente cierra el stream con RESOURCE_EXHAUSTED: hay que volver a suscribirse.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeEvent);

  // Explora las variables del dispositivo (solo drivers con exploración, p.ej. s7-symbolic). Exige que esté conectado.
  rpc Browse(BrowseRequest) returns (BrowseReply);

  // Configuración completa en uso (dispositivos, grupos de escaneo y tags).
  rpc GetConfiguration(google.protobuf.Empty) returns (Configuration);

  // Configuración de un dispositivo.
  rpc GetDeviceConfig(DeviceRequest) returns (DeviceConfig);

  // Alta o modificación de un dispositivo con sus grupos y tags. Se valida todo antes de aplicar; si hay errores
  // devuelve INVALID_ARGUMENT con la lista y no cambia nada. Si solo cambian grupos, tags o la llave de escritura se
  // aplica en caliente (sin reconectar; los tags que no cambian conservan su valor); si cambia la conexión, el
  // dispositivo se reinicia.
  rpc PutDevice(PutDeviceRequest) returns (Device);

  // Baja de un dispositivo.
  rpc DeleteDevice(DeleteDeviceRequest) returns (google.protobuf.Empty);

  // Histórico de uno o varios tags entre dos instantes, en bruto o agregado por intervalo.
  // Si el historiador está desactivado: FAILED_PRECONDITION.
  rpc QueryHistory(HistoryRequest) returns (HistoryReply);

  // Pasa el histórico guardado con un nombre a otro (tras renombrar un tag o un dispositivo); si el nombre nuevo ya tiene
  // muestras, se juntan. Si el historiador está desactivado: FAILED_PRECONDITION.
  rpc RenameHistory(RenameHistoryRequest) returns (RenameHistoryReply);

  // Borra lo guardado de unos tags entre dos instantes (ambos incluidos). Si el historiador está desactivado:
  // FAILED_PRECONDITION.
  rpc DeleteHistory(DeleteHistoryRequest) returns (DeleteHistoryReply);

  // Transformaciones de valores (p.ej. 0 = Parado, 1 = Marcha) que se asignan a los tags por su nombre.
  rpc GetTransforms(google.protobuf.Empty) returns (TransformList);

  // Sustituye todas las transformaciones. Se valida antes de aplicar (nombres y valores repetidos, transformaciones
  // en uso por algún tag); si hay errores devuelve INVALID_ARGUMENT con la lista y no cambia nada.
  rpc PutTransforms(PutTransformsRequest) returns (TransformList);

  // Servidor OPC UA del agente: ajustes, estado y certificados de los clientes.
  rpc GetOpcUa(google.protobuf.Empty) returns (OpcUaInfo);

  // Cambia los ajustes OPC UA, los guarda y los aplica (arranca, para o reinicia el servidor). Si no son válidos:
  // INVALID_ARGUMENT con la lista y no cambia nada.
  rpc PutOpcUa(PutOpcUaRequest) returns (OpcUaInfo);

  // Acepta el certificado (rechazado) de un cliente OPC UA. NOT_FOUND si no está.
  rpc TrustOpcUaCertificate(OpcUaCertificateRequest) returns (OpcUaInfo);

  // Quita el certificado de un cliente OPC UA (rechazado o aceptado): ese cliente deja de poder conectar.
  rpc DeleteOpcUaCertificate(OpcUaCertificateRequest) returns (OpcUaInfo);
}

enum ConnectionState {
  CONNECTION_STATE_DISCONNECTED = 0;
  CONNECTION_STATE_CONNECTING = 1;
  CONNECTION_STATE_CONNECTED = 2;
  CONNECTION_STATE_FAULTED = 3;
}

enum Quality {
  QUALITY_GOOD = 0;
  QUALITY_UNCERTAIN = 1;
  QUALITY_BAD = 2;
  QUALITY_BAD_NOT_CONNECTED = 3;
  QUALITY_BAD_ADDRESS_INVALID = 4;
  QUALITY_BAD_ACCESS_DENIED = 5;
  QUALITY_BAD_TYPE_MISMATCH = 6;
  QUALITY_BAD_TIMEOUT = 7;
  QUALITY_BAD_CONFIGURATION = 8;
  QUALITY_BAD_NOT_SUPPORTED = 9;
  QUALITY_BAD_WRITE_DISABLED = 10;
}

enum DataType {
  DATA_TYPE_UNKNOWN = 0;
  DATA_TYPE_BOOLEAN = 1;
  DATA_TYPE_S_BYTE = 2;
  DATA_TYPE_BYTE = 3;
  DATA_TYPE_INT16 = 4;
  DATA_TYPE_U_INT16 = 5;
  DATA_TYPE_INT32 = 6;
  DATA_TYPE_U_INT32 = 7;
  DATA_TYPE_INT64 = 8;
  DATA_TYPE_U_INT64 = 9;
  DATA_TYPE_FLOAT = 10;
  DATA_TYPE_DOUBLE = 11;
  DATA_TYPE_STRING = 12;
  DATA_TYPE_DATE_TIME = 13;
  DATA_TYPE_TIME_SPAN = 14;
  DATA_TYPE_BYTE_ARRAY = 15;
}

message AgentInfo {
  string version = 1;
  string machine = 2;
  string os = 3;
  google.protobuf.Timestamp started = 4;
  string config_path = 5;
  repeated Driver drivers = 6;
  HistorianInfo historian = 7;
  // Acceso de quien llama, según el token con el que entró.
  AccessLevel access = 8;
  // Puertos serie del equipo del agente (COM3, /dev/ttyUSB0, /dev/serial/by-id/...) para Modbus RTU. Vacío en agentes
  // anteriores a la 1.15.
  repeated string serial_ports = 9;
}

enum AccessLevel {
  // Agente anterior a los roles (1.11 o antes): un solo token, acceso completo.
  ACCESS_LEVEL_UNSPECIFIED = 0;
  // Token de solo lectura: leer, suscribirse, explorar, ver la configuración y el histórico. Lo demás: PERMISSION_DENIED.
  ACCESS_LEVEL_READ = 1;
  // Token completo (o agente local sin token): además escribir, configurar y borrar o renombrar histórico.
  ACCESS_LEVEL_FULL = 2;
}

message HistorianInfo {
  bool enabled = 1;
  // Carpeta de los ficheros del histórico (uno por mes).
  string path = 2;
  int32 retention_days = 3;
  int64 size_bytes = 4;
  int32 files = 5;
  int32 historized_tags = 6;
}

message Driver {
  string id = 1;
  string name = 2;
  // Ajustes por defecto del driver en JSON (plantilla para formularios).
  string default_settings_json = 3;
  bool can_browse = 4;
  bool can_write = 5;
}

message Device {
  string name = 1;
  string driver = 2;
  bool enabled = 3;
  bool writes_enabled = 4;
  ConnectionState state = 5;
  // Motivo del último error o cambio de estado.
  string detail = 6;
  google.protobuf.Timestamp since = 7;
  // Próximo intento de conexión cuando está esperando para reconectar.
  google.protobuf.Timestamp next_retry = 8;
  int32 tag_count = 9;
  // Primera llave de publicación en el servidor OPC UA del agente.
  bool opc_ua_published = 10;
}

message DeviceList {
  repeated Device devices = 1;
}

message DeviceRequest {
  string device = 1;
}

message SetDeviceEnabledRequest {
  string device = 1;
  bool enabled = 2;
  bool persist = 3;
}

message DeviceInfo {
  map<string, string> properties = 1;
}

message TagValue {
  // Valor en texto (cultura invariante), siempre presente; vacío si la calidad es mala.
  string text = 1;
  DataType data_type = 2;
  Quality quality = 3;
  google.protobuf.Timestamp timestamp = 4;
  string error = 5;
  // Valor bruto del dispositivo en texto si el tag está escalado; vacío si no.
  string raw_text = 6;
  // Valor tipado, para clientes que necesitan números (gráficas, OPC UA...).
  oneof typed {
    bool bool_value = 10;
    sint64 int_value = 11;
    uint64 uint_value = 12;
    double double_value = 13;
    string string_value = 14;
    bytes bytes_value = 15;
    google.protobuf.Timestamp time_value = 16;
    google.protobuf.Duration duration_value = 17;
  }
}

message Tag {
  string device = 1;
  string name = 2;
  string address = 3;
  string group = 4;
  int32 interval_ms = 5;
  bool writable = 6;
  TagValue value = 7;
  // Se guarda en el histórico.
  bool historized = 8;
  // Transformación que se aplica al mostrar el valor; vacío = ninguna.
  string transform = 9;
  // Grupo de visualización (carpeta plegable en la tabla); vacío = sin grupo.
  string folder = 10;
  // Unidad con la que se muestra el valor (bar, °C...); vacío = ninguna.
  string unit = 11;
  // Decimales con los que se muestran los reales; ausente = el valor completo.
  optional int32 decimals = 12;
  // Escalado a unidades de ingeniería que aplica el agente; ausente = el valor tal como lo lee el driver.
  Scaling scaling = 13;
}

message ListTagsRequest {
  // Vacío: los tags de todos los dispositivos.
  string device = 1;
}

message TagList {
  repeated Tag tags = 1;
}

message ReadRequest {
  string device = 1;
  repeated string addresses = 2;
}

message ReadReply {
  repeated TagValue values = 1;
}

message WriteRequest {
  string device = 1;
  string tag = 2;
  // Valor en texto, cultura invariante (punto decimal; true/false o 1/0).
  string value = 3;
  // Quién escribe, para el log de auditoría.
  string user = 4;
}

message WriteReply {
  bool success = 1;
  Quality quality = 2;
  string error = 3;
}

message SubscribeRequest {
  // Dispositivos de interés; vacío = todos.
  repeated string devices = 1;
}

message Snapshot {
  repeated Device devices = 1;
  repeated Tag tags = 2;
  repeated ValueTransform transforms = 3;
}

message TagUpdate {
  string device = 1;
  string tag = 2;
  TagValue value = 3;
}

message TagUpdates {
  repeated TagUpdate updates = 1;
}

message SubscribeEvent {
  oneof event {
    Snapshot snapshot = 1;
    TagUpdates tag_updates = 2;
    Device device_status = 3;
    // El dispositivo se ha dado de alta o se ha reconfigurado: sustituye todos sus tags por estos.
    DeviceConfigured device_configured = 4;
    DeviceRemoved device_removed = 5;
    // Han cambiado las transformaciones: sustituyen a todas las anteriores.
    TransformList transforms = 6;
  }
}

message DeviceConfigured {
  Device device = 1;
  repeated Tag tags = 2;
}

message DeviceRemoved {
  string device = 1;
}

message BrowseRequest {
  string device = 1;
  // Texto que debe contener el nombre (sin distinguir mayúsculas); vacío = todo.
  string filter = 2;
  // Máximo de resultados (por defecto 100).
  int32 max_results = 3;
  // Volver a explorar la CPU en lugar de usar la caché.
  bool refresh = 4;
}

message BrowseItem {
  string address = 1;
  DataType data_type = 2;
  // Tipo nativo del PLC (Int, Real, String...).
  string native_type = 3;
}

message BrowseReply {
  repeated BrowseItem items = 1;
  int32 total_matches = 2;
  int32 total_symbols = 3;
}

message ReconnectConfig {
  int32 initial_delay_ms = 1;
  int32 max_delay_ms = 2;
  double multiplier = 3;
}

message TagConfig {
  // Vacío = se usa la dirección como nombre.
  string name = 1;
  string address = 2;
  bool writable = 3;
  // DATA_TYPE_UNKNOWN = lo deduce el driver.
  DataType data_type = 4;
  // Historización; ausente = no se historiza.
  HistoryConfig history = 5;
  // Nombre de la transformación que se aplica al mostrar el valor; vacío = ninguna.
  string transform = 6;
  // Grupo de visualización (carpeta plegable en la tabla); vacío = sin grupo.
  string folder = 7;
  // Unidad con la que se muestra el valor (bar, °C...); vacío = ninguna.
  string unit = 8;
  // Decimales con los que se muestran los reales; ausente = el valor completo. Solo afecta a la presentación.
  optional int32 decimals = 9;
  // Escalado a unidades de ingeniería: el agente lo aplica al leer y a la inversa al escribir; ausente = ninguno.
  Scaling scaling = 10;
  // Segunda llave de publicación en OPC UA, al revés: true = no se publica aunque el dispositivo sí. Así, lo que no
  // envía un cliente anterior (false) deja el tag publicado, que es el valor por defecto.
  bool opc_ua_hidden = 11;
}

message HistoryConfig {
  bool enabled = 1;
  // Intervalo mínimo entre muestras guardadas (0 = cada cambio).
  int32 min_interval_ms = 2;
  // Banda muerta (0 = cualquier cambio); en % del último valor si deadband_percent.
  double deadband = 3;
  bool deadband_percent = 4;
  // Tiempo máximo sin guardar: se repite el valor actual (0 = nunca).
  int32 max_interval_ms = 5;
  // Historizar solo mientras otro tag del dispositivo cumple una condición; ausente = siempre.
  HistoryTrigger trigger = 6;
}

enum TriggerCondition {
  TRIGGER_CONDITION_EQUAL = 0;
  TRIGGER_CONDITION_NOT_EQUAL = 1;
  TRIGGER_CONDITION_GREATER = 2;
  TRIGGER_CONDITION_GREATER_OR_EQUAL = 3;
  TRIGGER_CONDITION_LESS = 4;
  TRIGGER_CONDITION_LESS_OR_EQUAL = 5;
}

message HistoryTrigger {
  // Tag del mismo dispositivo que dispara.
  string tag = 1;
  TriggerCondition condition = 2;
  // true/false para booleanos; un número para los demás (= y ≠ admiten texto).
  string value = 3;
  // Se sigue guardando este tiempo después de que la condición deje de cumplirse.
  int32 hold_ms = 4;
}

enum HistoryAggregate {
  HISTORY_AGGREGATE_AVERAGE = 0;
  HISTORY_AGGREGATE_MIN = 1;
  HISTORY_AGGREGATE_MAX = 2;
  HISTORY_AGGREGATE_FIRST = 3;
  HISTORY_AGGREGATE_LAST = 4;
}

message HistoryRequest {
  string device = 1;
  repeated string tags = 2;
  // Por defecto: la última hora.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // 0 = puntos en bruto; >0 = agregados por intervalos de este tamaño.
  int32 interval_ms = 5;
  HistoryAggregate aggregate = 6;
  // Máximo de puntos por tag (por defecto 10000).
  int32 max_points = 7;
}

message HistoryPoint {
  google.protobuf.Timestamp timestamp = 1;
  // Valor numérico (booleanos como 0/1); ausente si el valor es texto o la calidad es mala sin valor.
  optional double number = 2;
  string text = 3;
  Quality quality = 4;
}

message HistorySeries {
  string device = 1;
  string tag = 2;
  repeated HistoryPoint points = 3;
  // Había más puntos que max_points.
  bool truncated = 4;
}

message HistoryReply {
  repeated HistorySeries series = 1;
}

message ScanGroupConfig {
  string name = 1;
  int32 interval_ms = 2;
  repeated TagConfig tags = 3;
}

message DeviceConfig {
  string name = 1;
  string driver = 2;
  bool enabled = 3;
  bool writes_enabled = 4;
  // Ajustes del driver en JSON (los mismos que en agent.json).
  string settings_json = 5;
  ReconnectConfig reconnect = 6;
  repeated ScanGroupConfig scan_groups = 7;
  // Primera llave de publicación en OPC UA: sin ella el dispositivo no aparece en el servidor OPC UA.
  bool opc_ua_published = 8;
}

message Configuration {
  repeated DeviceConfig devices = 1;
}

message PutDeviceRequest {
  DeviceConfig device = 1;
  // Nombre actual si se renombra el dispositivo; vacío = mismo nombre (o alta).
  string original_name = 2;
  // Guardar en agent.json.
  bool persist = 3;
}

message DeleteDeviceRequest {
  string device = 1;
  bool persist = 2;
}

// Transformación de valores enteros a texto.
message ValueTransform {
  string name = 1;
  repeated TransformEntry entries = 2;
}

message TransformEntry {
  int64 value = 1;
  string text = 2;
}

message TransformList {
  repeated ValueTransform transforms = 1;
}

message PutTransformsRequest {
  repeated ValueTransform transforms = 1;
  // Guardar en agent.json.
  bool persist = 2;
}

message HistoryRename {
  string from_device = 1;
  // Vacío (y to_tag vacío) = todos los tags del dispositivo.
  string from_tag = 2;
  string to_device = 3;
  string to_tag = 4;
}

message RenameHistoryRequest {
  repeated HistoryRename renames = 1;
}

message RenameHistoryReply {
  // Tags distintos cuyo histórico se ha movido.
  int32 moved = 1;
}

message DeleteHistoryRequest {
  string device = 1;
  repeated string tags = 2;
  // Obligatorios los dos.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message DeleteHistoryReply {
  // Muestras borradas.
  int64 deleted = 1;
}

// Escalado lineal por dos puntos: ing = (bruto − raw_min) / (raw_max − raw_min) × (eng_max − eng_min) + eng_min.
message Scaling {
  double raw_min = 1;
  double raw_max = 2;
  double eng_min = 3;
  double eng_max = 4;
  // Limitar al rango de ingeniería (y rechazar escrituras fuera de él).
  bool clamp = 5;
}

// Servidor OPC UA: solo canales firmados y cifrados y usuarios con contraseña (sin anónimo).
message OpcUaInfo {
  bool enabled = 1;
  int32 port = 2;
  // Tercera llave de escritura (además de WritesEnabled del dispositivo, Writable del tag y un usuario con rol de escritura).
  bool allow_writes = 3;
  // Sin contraseñas: nunca salen del agente.
  repeated OpcUaUser users = 4;
  OpcUaState state = 5;
  // Motivo del error, si lo hay.
  string detail = 6;
  // URL para los clientes (p.ej. opc.tcp://equipo:4840).
  string endpoint_url = 7;
  // Huella (SHA-1, la que muestran Ignition y UaExpert) del certificado del servidor.
  string certificate_thumbprint = 8;
  repeated OpcUaCertificate certificates = 9;
}

enum OpcUaState {
  OPC_UA_STATE_STOPPED = 0;
  OPC_UA_STATE_STARTING = 1;
  OPC_UA_STATE_RUNNING = 2;
  OPC_UA_STATE_ERROR = 3;
}

enum OpcUaRole {
  // Leer, suscribirse, explorar y leer el histórico.
  OPC_UA_ROLE_READ = 0;
  // Además escribir, si el servidor, el dispositivo y el tag lo permiten.
  OPC_UA_ROLE_WRITE = 1;
}

message OpcUaUser {
  string name = 1;
  OpcUaRole role = 2;
  // Solo en PutOpcUa: contraseña nueva. Vacía = se conserva la que tenía (obligatoria para un usuario nuevo).
  string password = 3;
}

message PutOpcUaRequest {
  bool enabled = 1;
  int32 port = 2;
  bool allow_writes = 3;
  // Lista completa: los que no estén se quitan.
  repeated OpcUaUser users = 4;
}

// Certificado de un cliente OPC UA (Ignition, UaExpert...).
message OpcUaCertificate {
  string thumbprint = 1;
  string subject = 2;
  string application_uri = 3;
  google.protobuf.Timestamp not_after = 4;
  // false = rechazado, pendiente de aceptar.
  bool trusted = 5;
}

message OpcUaCertificateRequest {
  string thumbprint = 1;
}
